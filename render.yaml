services:
  - type: web
    name: manage-backend
    runtime: docker
    repo: https://github.com/bigqz/manage
    plan: free
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        value: manage-jwt-secret-key-must-be-at-least-32-bytes-long-for-hs256-algorithm-2026
      - key: SPRING_PROFILES_ACTIVE
        value: prod
